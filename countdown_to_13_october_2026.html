<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Countdown to 13 October 2026</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:white;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center}.wrap{width:94vw;max-width:1100px}
.title{font-size:clamp(22px,4vw,52px);font-weight:700;letter-spacing:.08em;margin-bottom:25px;text-shadow:0 0 20px rgba(255,255,255,.18)}.title span{display:block;font-size:1.45em;letter-spacing:.12em;margin-top:8px}
.date{font-size:clamp(15px,2.5vw,28px);color:#999;margin-bottom:40px}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,24px)}
.unit{background:#111;border:1px solid #2b2b2b;border-radius:18px;padding:clamp(15px,3vw,35px) 8px}
.number{font-family:"Courier New",monospace;font-size:clamp(42px,9vw,120px);line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.label{margin-top:14px;color:#888;font-size:clamp(12px,2vw,22px);letter-spacing:.15em}
@media(max-width:650px){.timer{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class="wrap">
<div class="title">COUNTDOWN TO <span>NSC 2026</span></div>
<div class="date">THE NSC 2026 COUNTDOWN • 13 OCTOBER 2026 • 00:00 SAST</div>
<div id="timer" class="timer">
<div class="unit"><div id="days" class="number">00</div><div class="label">DAYS</div></div>
<div class="unit"><div id="hours" class="number">00</div><div class="label">HOURS</div></div>
<div class="unit"><div id="minutes" class="number">00</div><div class="label">MINUTES</div></div>
<div class="unit"><div id="seconds" class="number">00</div><div class="label">SECONDS</div></div>
</div></div>
<script>
const target=new Date("2026-10-13T00:00:00+02:00").getTime();
function update(){
 let d=Math.max(0,target-Date.now()),s=Math.floor(d/1000);
 if(!s){document.getElementById("timer").innerHTML='<div style="grid-column:1/-1;font-size:8vw;font-weight:700">IT’S 13 OCTOBER 2026</div>';return}
 let days=Math.floor(s/86400),hours=Math.floor(s%86400/3600),minutes=Math.floor(s%3600/60),seconds=s%60;
 document.getElementById("days").textContent=String(days).padStart(2,"0");
 document.getElementById("hours").textContent=String(hours).padStart(2,"0");
 document.getElementById("minutes").textContent=String(minutes).padStart(2,"0");
 document.getElementById("seconds").textContent=String(seconds).padStart(2,"0");
}
update();setInterval(update,250);
</script></body></html>
